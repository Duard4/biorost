<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/bio.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fallback title (overridden + extended by @unhead/vue at runtime / prerender) -->
    <title>
      ТМ «Біорост» – Органічні добрива та біопрепарати для аграріїв України
    </title>

    <!--
      SEO meta tags, Open Graph, Twitter cards and JSON-LD are managed centrally
      by src/js/seo.js via @unhead/vue, and baked into static HTML at build time
      by the prerender step. Do not duplicate them here.
    -->

    <!-- Preconnect & Fonts (font-display=swap prevents render-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="preload"
      as="image"
      href="/assets/bg-images/hero.webp"
      fetchpriority="high"
    />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
